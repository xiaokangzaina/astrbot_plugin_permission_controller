name: astrbot_plugin_permission_controller
display_name: 权限控制台
desc: 面向 AstrBot 的权限控制台，用 QQ 群、QQ 用户、私聊白名单、群聊黑名单和模型思考强度控制机器人调用权限，内置默认背景音乐与独立按钮音效。
help: 安装后打开插件设置页，左侧选择群聊或私聊对象，中间编辑权限策略，右侧可控制背景音乐、按钮音效和运行状态。背景音乐默认使用“小k橘子 - 劫后余生”，也支持在前端上传自定义背景音。
version: v3.0.2
author: xiaokangzaina
repo: "https://github.com/xiaokangzaina/astrbot_plugin_permission_controller"
astrbot_version: ">=4.0.0,<5"
support_platforms: [qq_official, aiocqhttp]
