name: astrbot_plugin_permission_controller
display_name: 权限控制台
desc: AstrBot 权限控制台，专注管理群聊权限、私聊权限、黑白名单、管理员绕过和思考强度，保留背景音乐、按钮音效、自定义背景音和自定义视觉背景上传。
help: 安装后打开插件配置页，选择群聊或私聊对象后编辑权限配置；背景音乐、按钮音效和播放进度会自动保存，自定义背景音可在音效模块上传，自定义视觉背景支持图片、GIF 和视频。
version: v3.1.0
author: xiaokangzaina
repo: "https://github.com/xiaokangzaina/astrbot_plugin_permission_controller"
astrbot_version: ">=4.0.0,<5"
support_platforms: [qq_official, aiocqhttp]
