name: astrbot_plugin_permission_controller
display_name: 权限控制器
desc: 按用户 QQ、群号、私聊白名单和群聊黑名单控制 AstrBot 机器人调用权限，支持分群/分用户配置模型思考强度。
help: simple_rules 填写 用户QQ-群号；allowed_groups 填写整体放行的群号并自动同步到平台白名单；private_chat_users 用于私聊白名单；reasoning_group_defaults 填写 群号=强度，reasoning_group_user_rules 填写 用户QQ-群号=强度，reasoning_private_users 填写 用户QQ=强度。
version: v2.1.0
author: xiaokangzaina
repo: "https://github.com/xiaokangzaina/astrbot_plugin_permission_controller"
astrbot_version: ">=4.0.0,<5"
support_platforms: [qq_official, aiocqhttp]
