<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>权限控制器配置</title>
    <link rel="stylesheet" href="./styles.css?v=super_ui_20260619_2233" />
</head>
<body>
    <div class="page-shell">
        <section class="workspace-shell">
            <header class="page-head module-card hero-card">
                <div class="page-head-text">
                    <div class="eyebrow">Permission Center</div>
                    <h2 class="page-title">权限控制器</h2>
                    <p class="page-subtitle">以群为模块管理放行、拒绝与白名单规则，统一控制 AstrBot 调用权限。</p>
                    <div class="hero-pills" aria-hidden="true">
                        <span>群权限</span>
                        <span>用户规则</span>
                        <span>黑白名单</span>
                    </div>
                    <div class="hero-status-row" aria-label="状态概览">
                        <section class="side-meta top-contact-meta">
                            <div><span>群聊</span><strong id="groupCountLabel">0</strong></div>
                            <div><span>私聊</span><strong id="privateCountLabel">0</strong></div>
                        </section>
                        <section class="hero-info-grid" aria-label="状态信息">
                            <div class="hero-info-card"><span>当前时间</span><strong id="currentTimeLabel">--:--:--</strong><em id="currentDateLabel">加载中</em></div>
                            <div class="hero-info-card"><span>系统版本</span><strong id="systemVersionLabel">读取中</strong><em id="pythonVersionLabel">Python --</em></div>
                            <div class="hero-info-card"><span>所在地天气</span><strong id="weatherLabel">定位中</strong><em id="weatherMetaLabel">需要浏览器定位</em></div>
                        </section>
                    </div>
                </div>
                <div class="page-head-actions">
                    <button class="ghost-button" id="toggleThemeBtn">主题：自动</button>
                    <button class="ghost-button" id="refreshGroupsBtn">同步群列表</button>
                    <button class="ghost-button" id="resetGroupBtn">清空该群配置</button>
                    <button class="primary-button" id="saveGroupBtn">保存群聊配置</button>
                </div>
            </header>

            <main class="group-workspace">
                <aside class="group-sidebar module-card">
                    <div class="module-title-row">
                        <div>
                            <span class="module-kicker">Groups</span>
                            <h3>群聊模块</h3>
                        </div>
                    </div>
                    <input id="groupSearchInput" class="group-search" type="text" placeholder="搜索群名或群号" />
                    <div id="groupList" class="group-list empty-state">群列表加载中…</div>
                </aside>

                <section class="group-config-panel module-card">
                    <div class="group-config-head">
                        <div>
                            <span class="module-kicker">Policy</span>
                            <h3 id="currentGroupTitle">请选择群聊</h3>
                            <p id="currentGroupMeta">点击左侧群聊头像即可配置</p>
                        </div>
                    </div>
                    <div id="groupForm" class="form-stack empty-state">请从左侧选择一个群聊。</div>
                </section>
            </main>
        </section>
    </div>

    <div class="toast-layer" id="toastLayer"></div>
    <script type="module" src="./app.js?v=super_ui_20260619_2233"></script>
</body>
</html>
